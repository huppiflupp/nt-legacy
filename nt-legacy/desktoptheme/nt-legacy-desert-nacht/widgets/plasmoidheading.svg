    </g>
    <g id="footer-bottomright">
      <rect x="82" y="38" width="6" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="82" y="43" width="6" height="1" fill="#0a1012"/>
      <rect x="82" y="42" width="5" height="1" fill="#16130e"/>
      <rect x="87" y="38" width="1" height="6" fill="#0a1012"/>
      <rect x="86" y="38" width="1" height="5" fill="#16130e"/>
    </g>
    <rect id="footer-hint-top-margin" x="72" y="12" width="2" height="4" fill="#ff00ff" opacity="0"/>
    <rect id="footer-hint-bottom-margin" x="72" y="40" width="2" height="4" fill="#ff00ff" opacity="0"/>
    <rect id="footer-hint-left-margin" x="56" y="28" width="4" height="2" fill="#ff00ff" opacity="0"/>
