      <rect x="62" y="12" width="20" height="1" fill="#0a1012"/>
      <rect x="62" y="13" width="20" height="1" fill="#544e42"/>
    </g>
    <g id="footer-topright">
      <rect x="82" y="12" width="6" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="82" y="12" width="6" height="1" fill="#0a1012"/>
      <rect x="82" y="13" width="5" height="1" fill="#544e42"/>
      <rect x="87" y="12" width="1" height="6" fill="#0a1012"/>
      <rect x="86" y="13" width="1" height="5" fill="#16130e"/>
    </g>
    <g id="footer-left">
      <rect x="56" y="18" width="6" height="20" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="56" y="18" width="1" height="20" fill="#0a1012"/>
      <rect x="57" y="18" width="1" height="20" fill="#544e42"/>
    </g>
    <g id="footer-center">
      <rect x="62" y="18" width="20" height="20" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
    </g>
    <g id="footer-right">
      <rect x="82" y="18" width="6" height="20" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="87" y="18" width="1" height="20" fill="#0a1012"/>
      <rect x="86" y="18" width="1" height="20" fill="#16130e"/>
    </g>
    <g id="footer-bottomleft">
      <rect x="56" y="38" width="6" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="56" y="43" width="6" height="1" fill="#0a1012"/>
      <rect x="57" y="42" width="5" height="1" fill="#16130e"/>
