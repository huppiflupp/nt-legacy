      <rect x="12" y="38" width="1" height="6" fill="#0a1012"/>
      <rect x="13" y="38" width="1" height="5" fill="#544e42"/>
    </g>
    <g id="header-bottom">
      <rect x="18" y="38" width="20" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="18" y="43" width="20" height="1" fill="#0a1012"/>
      <rect x="18" y="42" width="20" height="1" fill="#16130e"/>
    </g>
    <g id="header-bottomright">
      <rect x="38" y="38" width="6" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="38" y="43" width="6" height="1" fill="#0a1012"/>
      <rect x="38" y="42" width="5" height="1" fill="#16130e"/>
      <rect x="43" y="38" width="1" height="6" fill="#0a1012"/>
      <rect x="42" y="38" width="1" height="5" fill="#16130e"/>
    </g>
    <rect id="header-hint-top-margin" x="28" y="12" width="2" height="4" fill="#ff00ff" opacity="0"/>
    <rect id="header-hint-bottom-margin" x="28" y="40" width="2" height="4" fill="#ff00ff" opacity="0"/>
    <rect id="header-hint-left-margin" x="12" y="28" width="4" height="2" fill="#ff00ff" opacity="0"/>
    <rect id="header-hint-right-margin" x="40" y="28" width="4" height="2" fill="#ff00ff" opacity="0"/>
  <!-- footer -->
    <g id="footer-topleft">
      <rect x="56" y="12" width="6" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="56" y="12" width="6" height="1" fill="#0a1012"/>
      <rect x="57" y="13" width="5" height="1" fill="#544e42"/>
