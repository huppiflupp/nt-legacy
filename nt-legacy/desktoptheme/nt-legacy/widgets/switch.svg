<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="188" height="100" viewBox="0 0 188 100">
  <!-- switch.svg — Umschalter (Systemabschnitt, Benachrichtigungen) -->
  <!-- Erzeugt von tools/gen-plasma-svg.py. Die Element-IDs sind
       die Schnittstelle zu Plasma: bitte nicht umbenennen. -->
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color:#202628; stop-color:#202628; }
      .ColorScheme-Background { color:#d8d8d0; stop-color:#d8d8d0; }
      .ColorScheme-Highlight { color:#287f8c; stop-color:#287f8c; }
      .ColorScheme-ViewText { color:#202628; stop-color:#202628; }
      .ColorScheme-ViewBackground { color:#f0f0e8; stop-color:#f0f0e8; }
      .ColorScheme-ViewHover { color:#d6a23a; stop-color:#d6a23a; }
      .ColorScheme-ViewFocus { color:#287f8c; stop-color:#287f8c; }
      .ColorScheme-ButtonText { color:#202628; stop-color:#202628; }
      .ColorScheme-ButtonBackground { color:#d8d8d0; stop-color:#d8d8d0; }
      .ColorScheme-ButtonHover { color:#d6a23a; stop-color:#d6a23a; }
      .ColorScheme-ButtonFocus { color:#287f8c; stop-color:#287f8c; }
      .ColorScheme-HighlightedText { color:#f0f0e8; stop-color:#f0f0e8; }
      .ColorScheme-ComplementaryBackground { color:#b8c4c4; stop-color:#b8c4c4; }
      .ColorScheme-NegativeText { color:#a83232; stop-color:#a83232; }
      .ColorScheme-NeutralText { color:#c87922; stop-color:#c87922; }
      .ColorScheme-PositiveText { color:#39734a; stop-color:#39734a; }
    </style>
  </defs>
  <!-- inactive -->
