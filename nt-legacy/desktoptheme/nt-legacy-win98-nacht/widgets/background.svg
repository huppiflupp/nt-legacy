<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="56" viewBox="0 0 100 56">
  <!-- background.svg — Hintergrund von Plasmoids -->
  <!-- Erzeugt von tools/gen-plasma-svg.py. Die Element-IDs sind
       die Schnittstelle zu Plasma: bitte nicht umbenennen. -->
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color:#0a1012; stop-color:#0a1012; }
      .ColorScheme-Background { color:#2a3234; stop-color:#2a3234; }
      .ColorScheme-Highlight { color:#000080; stop-color:#000080; }
      .ColorScheme-ViewText { color:#0a1012; stop-color:#0a1012; }
      .ColorScheme-ViewBackground { color:#1e2628; stop-color:#1e2628; }
      .ColorScheme-ViewHover { color:#dcdcdc; stop-color:#dcdcdc; }
      .ColorScheme-ViewFocus { color:#000080; stop-color:#000080; }
      .ColorScheme-ButtonText { color:#0a1012; stop-color:#0a1012; }
      .ColorScheme-ButtonBackground { color:#2a3234; stop-color:#2a3234; }
      .ColorScheme-ButtonHover { color:#dcdcdc; stop-color:#dcdcdc; }
      .ColorScheme-ButtonFocus { color:#000080; stop-color:#000080; }
      .ColorScheme-HighlightedText { color:#1e2628; stop-color:#1e2628; }
      .ColorScheme-ComplementaryBackground { color:#232b2d; stop-color:#232b2d; }
      .ColorScheme-NegativeText { color:#800000; stop-color:#800000; }
      .ColorScheme-NeutralText { color:#808000; stop-color:#808000; }
      .ColorScheme-PositiveText { color:#008000; stop-color:#008000; }
    </style>
  </defs>
  <!-- (Standardzustand) -->
    <g id="topleft">
      <rect x="12" y="12" width="6" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="12" y="12" width="6" height="1" fill="#0a1012"/>
      <rect x="13" y="13" width="5" height="1" fill="#4a5456"/>
      <rect x="12" y="12" width="1" height="6" fill="#0a1012"/>
      <rect x="13" y="13" width="1" height="5" fill="#4a5456"/>
    </g>
    <g id="top">
      <rect x="18" y="12" width="20" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="18" y="12" width="20" height="1" fill="#0a1012"/>
      <rect x="18" y="13" width="20" height="1" fill="#4a5456"/>
    </g>
    <g id="topright">
      <rect x="38" y="12" width="6" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="38" y="12" width="6" height="1" fill="#0a1012"/>
      <rect x="38" y="13" width="5" height="1" fill="#4a5456"/>
      <rect x="43" y="12" width="1" height="6" fill="#0a1012"/>
      <rect x="42" y="13" width="1" height="5" fill="#0e1416"/>
    </g>
    <g id="left">
      <rect x="12" y="18" width="6" height="20" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="12" y="18" width="1" height="20" fill="#0a1012"/>
      <rect x="13" y="18" width="1" height="20" fill="#4a5456"/>
    </g>
    <g id="center">
      <rect x="18" y="18" width="20" height="20" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
    </g>
    <g id="right">
      <rect x="38" y="18" width="6" height="20" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="43" y="18" width="1" height="20" fill="#0a1012"/>
      <rect x="42" y="18" width="1" height="20" fill="#0e1416"/>
    </g>
    <g id="bottomleft">
      <rect x="12" y="38" width="6" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="12" y="43" width="6" height="1" fill="#0a1012"/>
      <rect x="13" y="42" width="5" height="1" fill="#0e1416"/>
      <rect x="12" y="38" width="1" height="6" fill="#0a1012"/>
      <rect x="13" y="38" width="1" height="5" fill="#4a5456"/>
    </g>
    <g id="bottom">
      <rect x="18" y="38" width="20" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="18" y="43" width="20" height="1" fill="#0a1012"/>
      <rect x="18" y="42" width="20" height="1" fill="#0e1416"/>
    </g>
    <g id="bottomright">
      <rect x="38" y="38" width="6" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="38" y="43" width="6" height="1" fill="#0a1012"/>
      <rect x="38" y="42" width="5" height="1" fill="#0e1416"/>
      <rect x="43" y="38" width="1" height="6" fill="#0a1012"/>
      <rect x="42" y="38" width="1" height="5" fill="#0e1416"/>
    </g>
    <rect id="hint-top-margin" x="28" y="12" width="2" height="4" fill="#ff00ff" opacity="0"/>
    <rect id="hint-bottom-margin" x="28" y="40" width="2" height="4" fill="#ff00ff" opacity="0"/>
    <rect id="hint-left-margin" x="12" y="28" width="4" height="2" fill="#ff00ff" opacity="0"/>
    <rect id="hint-right-margin" x="40" y="28" width="4" height="2" fill="#ff00ff" opacity="0"/>
    <rect id="hint-top-inset" x="20" y="12" width="1e-08" height="1e-08" fill="#ff00ff" opacity="0"/>
    <rect id="hint-bottom-inset" x="20" y="44" width="1e-08" height="1e-08" fill="#ff00ff" opacity="0"/>
    <rect id="hint-left-inset" x="12" y="20" width="1e-08" height="1e-08" fill="#ff00ff" opacity="0"/>
    <rect id="hint-right-inset" x="44" y="20" width="1e-08" height="1e-08" fill="#ff00ff" opacity="0"/>
  <!-- mask -->
    <g id="mask-topleft">
      <rect x="56" y="12" width="6" height="6" fill="#2a3234"/>
      <rect x="56" y="12" width="6" height="1" fill="#ffffff"/>
      <rect x="57" y="13" width="5" height="1" fill="#ffffff"/>
      <rect x="56" y="12" width="1" height="6" fill="#ffffff"/>
      <rect x="57" y="13" width="1" height="5" fill="#ffffff"/>
    </g>
    <g id="mask-top">
      <rect x="62" y="12" width="20" height="6" fill="#2a3234"/>
      <rect x="62" y="12" width="20" height="1" fill="#ffffff"/>
      <rect x="62" y="13" width="20" height="1" fill="#ffffff"/>
    </g>
    <g id="mask-topright">
      <rect x="82" y="12" width="6" height="6" fill="#2a3234"/>
      <rect x="82" y="12" width="6" height="1" fill="#ffffff"/>
      <rect x="82" y="13" width="5" height="1" fill="#ffffff"/>
      <rect x="87" y="12" width="1" height="6" fill="#ffffff"/>
      <rect x="86" y="13" width="1" height="5" fill="#ffffff"/>
    </g>
    <g id="mask-left">
      <rect x="56" y="18" width="6" height="20" fill="#2a3234"/>
      <rect x="56" y="18" width="1" height="20" fill="#ffffff"/>
      <rect x="57" y="18" width="1" height="20" fill="#ffffff"/>
    </g>
    <g id="mask-center">
      <rect x="62" y="18" width="20" height="20" fill="#2a3234"/>
    </g>
    <g id="mask-right">
      <rect x="82" y="18" width="6" height="20" fill="#2a3234"/>
      <rect x="87" y="18" width="1" height="20" fill="#ffffff"/>
      <rect x="86" y="18" width="1" height="20" fill="#ffffff"/>
    </g>
    <g id="mask-bottomleft">
      <rect x="56" y="38" width="6" height="6" fill="#2a3234"/>
      <rect x="56" y="43" width="6" height="1" fill="#ffffff"/>
      <rect x="57" y="42" width="5" height="1" fill="#ffffff"/>
      <rect x="56" y="38" width="1" height="6" fill="#ffffff"/>
      <rect x="57" y="38" width="1" height="5" fill="#ffffff"/>
    </g>
    <g id="mask-bottom">
      <rect x="62" y="38" width="20" height="6" fill="#2a3234"/>
      <rect x="62" y="43" width="20" height="1" fill="#ffffff"/>
      <rect x="62" y="42" width="20" height="1" fill="#ffffff"/>
    </g>
    <g id="mask-bottomright">
      <rect x="82" y="38" width="6" height="6" fill="#2a3234"/>
      <rect x="82" y="43" width="6" height="1" fill="#ffffff"/>
      <rect x="82" y="42" width="5" height="1" fill="#ffffff"/>
      <rect x="87" y="38" width="1" height="6" fill="#ffffff"/>
      <rect x="86" y="38" width="1" height="5" fill="#ffffff"/>
    </g>
</svg>
