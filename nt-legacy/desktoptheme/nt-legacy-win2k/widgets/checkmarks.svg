<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="56" viewBox="0 0 100 56">
  <!-- checkmarks.svg — Haken in Ankreuzfeldern -->
  <!-- Erzeugt von tools/gen-plasma-svg.py. Die Element-IDs sind
       die Schnittstelle zu Plasma: bitte nicht umbenennen. -->
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color:#000000; stop-color:#000000; }
      .ColorScheme-Background { color:#d4d0c8; stop-color:#d4d0c8; }
      .ColorScheme-Highlight { color:#0a246a; stop-color:#0a246a; }
      .ColorScheme-ViewText { color:#000000; stop-color:#000000; }
      .ColorScheme-ViewBackground { color:#ffffff; stop-color:#ffffff; }
      .ColorScheme-ViewHover { color:#316ac5; stop-color:#316ac5; }
      .ColorScheme-ViewFocus { color:#0a246a; stop-color:#0a246a; }
      .ColorScheme-ButtonText { color:#000000; stop-color:#000000; }
      .ColorScheme-ButtonBackground { color:#d4d0c8; stop-color:#d4d0c8; }
      .ColorScheme-ButtonHover { color:#316ac5; stop-color:#316ac5; }
      .ColorScheme-ButtonFocus { color:#0a246a; stop-color:#0a246a; }
      .ColorScheme-HighlightedText { color:#ffffff; stop-color:#ffffff; }
      .ColorScheme-ComplementaryBackground { color:#d4d0c8; stop-color:#d4d0c8; }
      .ColorScheme-NegativeText { color:#a83232; stop-color:#a83232; }
      .ColorScheme-NeutralText { color:#c87922; stop-color:#c87922; }
      .ColorScheme-PositiveText { color:#39734a; stop-color:#39734a; }
    </style>
  </defs>
    <g id="checkbox">
      <path d="M17.12,28 L24.736,35.616 L38.88,20.384" fill="none" stroke="#000000" stroke-width="3.84" stroke-linecap="square"/>
    </g>
    <g id="radiobutton">
      <circle cx="72" cy="28" r="5.44" fill="#000000"/>
    </g>
</svg>
